[project]
name = "cutmate-api"
version = "0.1.0"
description = "Local-first FastAPI backend for CutMate AI"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.136.3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1"
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pyinstaller>=6,<7",
  "pyright>=1.1,<2",
  "pytest>=8.4,<9",
  "ruff>=0.14,<0.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
